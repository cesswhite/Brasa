<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Brasa · Entra al mundo</title><script type="module" src="/auth/client.js"></script>
<style>
*{box-sizing:border-box}[hidden]{display:none!important}:root{color-scheme:dark}body{margin:0;background:var(--background-dark,#091b23);color:var(--text-primary,#f5e7cf);font-family:var(--font-body,'Avenir Next',Arial,sans-serif);-webkit-font-smoothing:antialiased}body::before{content:"";position:fixed;inset:0;z-index:-2;background:url('/auth/art/world.png') center/cover no-repeat}body::after{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(4,12,14,.94),rgba(4,12,14,.78) 45%,rgba(4,12,14,.1)),linear-gradient(0deg,rgba(4,12,14,.8),transparent 60%)}
header{position:absolute;left:clamp(24px,5vw,80px);top:32px}.brand{color:var(--warning,#efb66f);font-size:13px;letter-spacing:.24em;font-weight:700}.edition{display:block;font-size:12px;color:var(--text-secondary,#9ab3ac);margin-top:8px;letter-spacing:.08em}
main{min-height:100svh;display:flex;align-items:center;padding:120px clamp(24px,10vw,160px) 64px;gap:64px}.entry{width:min(100%,410px);z-index:1}.eyebrow{color:var(--warning,#efb66f);font-size:12px;letter-spacing:.15em;text-transform:uppercase}h1{font-family:var(--font-heading,Georgia,serif);font-weight:400;font-size:clamp(34px,4vw,52px);line-height:1.1;margin:16px 0;text-wrap:balance}p{font-size:16px;line-height:1.55;text-wrap:pretty;margin:0 0 24px;color:var(--text-primary,#f5e7cf)}.context{color:var(--text-secondary,#9ab3ac)}button{font:inherit;cursor:pointer;min-height:48px;line-height:1.35;touch-action:manipulation}button.primary{width:100%;padding:16px 24px;border:1px solid var(--bronze,#ac8558);border-radius:5px;background:linear-gradient(#f1c385,#d79d54);box-shadow:inset 0 0 0 3px #53371944,0 4px 12px #0005;color:var(--ink,#152329);font-weight:700;transition:background-color .15s,filter .15s}.primary:hover{filter:brightness(1.08)}.primary:active{filter:brightness(.9)}button.link{display:block;border:0;background:none;color:var(--text-primary,#f5e7cf);padding:12px 4px;margin:4px auto;text-decoration:underline;text-underline-offset:5px;font-size:14px}button.link:hover{color:var(--warning,#efb66f)}button:focus-visible,summary:focus-visible{outline:2px solid var(--focus,#f8e8b9);outline-offset:4px}button:disabled{cursor:wait;filter:saturate(.1);opacity:.65}.code-wrap{margin:20px 0 24px;padding:16px 0;border-block:1px solid #ac855855}.code-wrap p{font-size:14px;margin:0 0 8px}.code{font-size:24px;color:var(--warning,#efb66f);letter-spacing:.18em;font-variant-numeric:tabular-nums}.figure{position:fixed;right:5vw;bottom:6vh;width:min(46vw,620px);aspect-ratio:1;background:url('/auth/art/fighter.png') 0 0/400% 200% no-repeat;pointer-events:none;z-index:0}.floor{position:fixed;right:14vw;bottom:8vh;width:25vw;height:30px;background:#0005;filter:blur(16px);z-index:-1}#status{font-size:14px;margin:16px 0 0;min-height:0;color:var(--warning,#efb66f)}#status:empty{display:none}.quiet{margin-top:24px;font-size:13px;color:var(--text-secondary,#9ab3ac)}details{margin-top:20px;font-size:14px}summary{cursor:pointer;padding:12px 0;min-height:44px;color:var(--text-secondary,#9ab3ac)}details p{font-size:14px;margin-top:8px}.keys{list-style:none;padding:0;margin:24px 0}.keys li{padding:12px 0;border-bottom:1px solid #ac855833;color:var(--text-primary,#f5e7cf)}.spinner{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;margin-right:10px;animation:turn .8s linear infinite}@keyframes turn{to{transform:rotate(360deg)}}
@media(max-width:720px){header{top:24px}main{align-items:flex-end;padding:230px 24px 32px;min-height:100svh}.entry{margin:auto auto 0;max-width:430px}.figure{width:300px;right:calc(50% - 150px);bottom:auto;top:34px;opacity:.72}body::after{background:linear-gradient(0deg,rgba(4,12,14,.96) 0%,rgba(4,12,14,.87) 52%,rgba(4,12,14,.25))}h1{font-size:34px;margin-top:12px}.floor{display:none}.edition{display:none}.brand{font-size:12px}.code-wrap{margin:16px 0}.quiet{margin-top:16px}}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style><link rel="stylesheet" href="/auth/art/tokens.css"></head><body><header><span class="brand">BRASA</span><span class="edition">LIGA DE LOS FAROLES</span></header><div class="floor" aria-hidden="true"></div><div class="figure" aria-hidden="true"></div><main><section class="entry" aria-labelledby="title" aria-busy="true"><span id="eyebrow" class="eyebrow">EL PATIO TE ESPERA</span><h1 id="title">Entrando…</h1><p id="description" class="context"></p><section id="device" class="code-wrap" hidden aria-label="Confirmación del juego"><p>Continúa sólo si este código coincide con el de tu juego.</p><strong id="code" class="code"></strong></section><ul id="keys" class="keys" hidden aria-label="Tus passkeys"></ul><button id="primary" class="primary" hidden>Continuar</button><button id="secondary" class="link" hidden></button><button id="recovery" class="link" hidden>No puedo entrar</button><button id="security" class="link" hidden>Cuenta y seguridad</button><details id="why" hidden><summary>¿Cómo se guarda mi acceso?</summary><p>Tu dispositivo lo protege con su huella, rostro o PIN. No necesitas una contraseña de Brasa.</p></details><p id="status" role="status" aria-live="polite" aria-atomic="true"></p><p id="footer" class="quiet"></p></section></main></body></html>
